# Render blueprint for the API + managed PostgreSQL. Commit ml/artifacts (except the
# transformer checkpoint) or build them in CI before deploying.
services:
  - type: web
    name: news-tally-api
    runtime: docker
    dockerfilePath: backend/Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: NT_ENVIRONMENT
        value: production
      - key: NT_CORS_ORIGINS
        value: https://news-tally.vercel.app
      - key: NT_DATABASE_URL
        fromDatabase: { name: news-tally-db, property: connectionString }
      # Free instances have 512 MB RAM: run retrieval lexical-only there.
      - key: NT_DISABLE_EMBEDDINGS
        value: "1"
databases:
  - name: news-tally-db
    plan: free
