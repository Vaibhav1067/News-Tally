# Local stack: PostgreSQL + API + frontend.   docker compose up --build
# Requires the ML artifacts to exist first (see README "Run the pipeline").
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: news_tally
      POSTGRES_PASSWORD: news_tally
      POSTGRES_DB: news_tally
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U news_tally"]
      interval: 5s
      retries: 10

  api:
    build: { context: ., dockerfile: backend/Dockerfile }
    environment:
      NT_DATABASE_URL: postgresql+psycopg2://news_tally:news_tally@db:5432/news_tally
      NT_CORS_ORIGINS: http://localhost:5173
    volumes:
      - ./ml/artifacts:/app/ml/artifacts:ro
    ports: ["8000:8000"]
    depends_on:
      db: { condition: service_healthy }

  web:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_API_URL: http://localhost:8000
    volumes: [./frontend:/app, /app/node_modules]
    ports: ["5173:5173"]
    depends_on: [api]

volumes:
  pgdata:
